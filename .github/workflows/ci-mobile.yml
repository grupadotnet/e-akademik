name: CI mobile

on:
  - push

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npx tsc --noEmit
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test -- --watchAll=false
